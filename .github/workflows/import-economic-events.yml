name: Import economic events

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar_bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: calendar_bridge/requirements.txt

      - run: pip install -r requirements.txt

      - run: python import_events.py --provider jblanked
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JBLANKED_API_KEY: ${{ secrets.JBLANKED_API_KEY }}
