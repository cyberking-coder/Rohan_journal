name: MetaApi sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: metaapi-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metaapi_bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: metaapi_bridge/package.json

      - run: npm install --no-audit --no-fund

      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          METAAPI_ENCRYPTION_KEY: ${{ secrets.METAAPI_ENCRYPTION_KEY }}
